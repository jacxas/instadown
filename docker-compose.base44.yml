services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["sh", "-c", "npm install && mkdir -p downloads data && exec node --watch server.js"]
    environment:
      - PORT=3000
      - NODE_ENV=development
      # Simula el checkout sin llaves de Stripe. Nunca se usa en producción.
      - PAYMENTS_PROVIDER=mock
      - SESSION_SECRET=dev-secret-no-usar-en-produccion
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
